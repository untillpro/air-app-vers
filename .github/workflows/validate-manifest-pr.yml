name: Validate Version Manifest

on:
  pull_request_target:
    branches:
      - main

jobs:
  check-author:
    runs-on: ubuntu-latest
    # Author verification uses REPOREADING_TOKEN, so this job does not need the implicit GITHUB_TOKEN.
    permissions: {}
    steps:
      - name: Check if PR author is in DevOps_releasep team
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPOREADING_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            const { data } = await github.rest.teams.getMembershipForUserInOrg({
              org: context.repo.owner,
              team_slug: 'DevOps_releasep',
              username: author
            }).catch(() => ({ data: null }));

            if (!data || data.state !== 'active') {
              core.setFailed(`${author} is not a member of DevOps_releasep team`);
            }

  validate:
    needs: check-author
    runs-on: ubuntu-latest
    # Restrict this job to the permissions listed below; all other GITHUB_TOKEN permissions are disabled.
    permissions:
      # Required by actions/checkout to read repository contents.
      contents: read
      # Required to post the validation result as a pull request comment.
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # PR creation is restricted to collaborators, and check-author gates this job to DevOps_releasep members.
          allow-unsafe-pr-checkout: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run tests
        run: python -m unittest discover scripts -v

      - name: Validate manifests
        id: validate
        run: python scripts/validate.py

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '';

            if (${{ steps.validate.outcome == 'success' }}) {
              comment = '✅ **Validation passed**\n\nAll manifest files are valid.';
            } else {
              const jobUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              comment = `❌ **Validation failed**\n\nPlease check the workflow logs for details:\n${jobUrl}`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  auto-merge:
    needs: validate
    runs-on: ubuntu-latest
    # Restrict this job to the single write permission below; all other GITHUB_TOKEN permissions are disabled.
    permissions:
      # Required by GitHub's pull request merge endpoint.
      contents: write
    if: success()
    steps:
      - name: Auto-merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const mergeMethod = headRef === 'main' ? 'merge' : 'squash';

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: mergeMethod
            });
